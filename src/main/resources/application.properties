spring.application.name=refund-limits
server.port=${PORT:8430}

spring.ai.mcp.server.name=ride-refunds
spring.ai.mcp.server.protocol=STREAMABLE

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5470}/refunds
spring.datasource.username=refunds
spring.datasource.password=refunds

# Which desk the agent talks to: cap-only, read-then-write, reserving.
refunds.desk=${REFUNDS_DESK:reserving}

# The authority a person used to hold. US cents; the business day is
# the database's calendar day (UTC in the demo container).
refunds.limits.max-per-refund-cents=2000
refunds.limits.max-customer-daily-cents=5000
refunds.limits.max-merchant-daily-cents=10000
refunds.limits.policy-version=2026-10-08.1

support.jwt.secret=${SUPPORT_JWT_SECRET}
